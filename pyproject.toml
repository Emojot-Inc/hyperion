[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperion"
version = "0.1.0"
description = "Provider-neutral LLM usage monitoring and cost instrumentation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "TBD"}
authors = [
    {name = "TBD"},
]
dependencies = []

[project.optional-dependencies]
langchain = [
    "langchain-core>=0",
]
litellm = [
    "litellm>=0",
]
mongo = [
    "pymongo>=0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
